name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-openadr against the reference implementations published by
# otfabric/openadr-interop: its clients against the OpenLEADR VTN, and its VTN
# with the ElaadNL client. The images are consumed as published: nothing of
# openadr-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
    inputs:
      openleadr_image:
        description: "OpenLEADR reference image (default: the pinned release)"
        required: false
      elaadnl_image:
        description: "ElaadNL reference image (default: the pinned release)"
        required: false
      openleadr301_image:
        description: "OpenLEADR v0.1.4 (OpenADR 3.0.1) reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/openadr-interop v0.6.3: OpenLEADR openleadr-rs v0.2.8,
  # ElaadNL openadr3-client 2.4.0, OpenLEADR v0.1.4 (OpenADR 3.0.1).
  # Keep in step with the Makefile and interop/harness_test.go.
  OPENADR_INTEROP_OPENLEADR_IMAGE: ${{ inputs.openleadr_image || 'ghcr.io/otfabric/openadr-interop-openleadr@sha256:331f178d185537743fbda4b3d5cf9d03e629f41e5b1a7f0865ec1e07e6c7b3a3' }}
  OPENADR_INTEROP_ELAADNL_IMAGE: ${{ inputs.elaadnl_image || 'ghcr.io/otfabric/openadr-interop-elaadnl@sha256:9be3e2939563d74ff125120726dfec55bc207fc5527bee2ddd3964f8cca384c2' }}
  OPENADR_INTEROP_OPENLEADR301_IMAGE: ${{ inputs.openleadr301_image || 'ghcr.io/otfabric/openadr-interop-openleadr301@sha256:d8f50f88389b035fed014dc05249e804dd51215d62b7323b9d0a3f74c36585ea' }}

jobs:
  interop:
    name: OpenLEADR VTN + ElaadNL client + MQTT brokers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Pull reference images
        run: |
          images=("${OPENADR_INTEROP_OPENLEADR_IMAGE}" "${OPENADR_INTEROP_ELAADNL_IMAGE}" "${OPENADR_INTEROP_OPENLEADR301_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Mosquitto, NanoMQ, HiveMQ CE and EMQX, for interop/brokers_test.go.
      # The test pulls what is missing; pulling here keeps the time out of
      # the test's own limits and retries a slow registry.
      - name: Pull MQTT broker images
        run: |
          sed -nE 's/^\t"(mosquitto|nanomq|hivemq|emqx)": +"([^"]+)",$/\2/p' interop/harness_test.go | while read -r image; do
            for attempt in 1 2 3 4 5; do
              docker pull --quiet "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore
