name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2.1.0
    with:
      codecov-name: go-openadr
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
      run-govulncheck: true
      # Measured 91.5 % with the coverpkg below (go-ci method).
      coverage-min: "91"
      fuzz-time: 10s
      # Match the Makefile's COVER_PKGS: the e2e tests drive client and server.
      coverpkg: github.com/otfabric/go-openadr,github.com/otfabric/go-openadr/auth,github.com/otfabric/go-openadr/client,github.com/otfabric/go-openadr/discovery,github.com/otfabric/go-openadr/internal/mqtt,github.com/otfabric/go-openadr/internal/wire,github.com/otfabric/go-openadr/internal/wire/codecs,github.com/otfabric/go-openadr/internal/wire/common,github.com/otfabric/go-openadr/internal/wire/v301,github.com/otfabric/go-openadr/internal/wire/v310,github.com/otfabric/go-openadr/internal/ws,github.com/otfabric/go-openadr/notification/mqtt,github.com/otfabric/go-openadr/notification/webhook,github.com/otfabric/go-openadr/notification/websocket,github.com/otfabric/go-openadr/objectjson,github.com/otfabric/go-openadr/server,github.com/otfabric/go-openadr/server/storage,github.com/otfabric/go-openadr/server/storage/storagetest,github.com/otfabric/go-openadr/timeline
    secrets: inherit

  # The self-contained examples must keep running as they are.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - run: make build examples

  # The module has no dependencies, and the examples that need a database
  # driver are a module of their own: both are checked here.
  storage:
    name: Example stores (SQLite, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/storage/go.mod
          cache-dependency-path: examples/storage/go.sum
      - run: make nodeps
      # PostgreSQL is started by the tests, in Docker; without it they fail.
      - run: make storage
        env:
          OPENADR_STORAGE_REQUIRE: "1"
