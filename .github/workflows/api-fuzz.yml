# Generated API tests of the VTN against the OpenADR 3.1.0 OpenAPI document,
# with a disposable VTN on localhost (scripts/api-fuzz.sh). Optional, reports
# only, and not part of CI or of the SAST gate. No secrets.
name: API fuzz
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/api-fuzz.yml
      - scripts/api-fuzz.sh

permissions:
  contents: read

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@v10
      - name: Run
        id: run
        continue-on-error: true
        env:
          MAX_TIME: "180"
        run: scripts/api-fuzz.sh "$RUNNER_TEMP/api-fuzz"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-fuzz-report
          path: ${{ runner.temp }}/api-fuzz
          retention-days: 14
      - name: Say what the run found
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: echo "Schemathesis outcome ${OUTCOME}; the report is in the artifact. This job does not gate anything." >> "$GITHUB_STEP_SUMMARY"
